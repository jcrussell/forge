# Docker Compose for Forge E2E Testing
# Uses Fedora version (maps to GNOME: F39=G45, F40=G46, F41=G47, F42=G48, F43=G49)
#
# NOTE: This container requires systemd as PID 1.
# For interactive use, prefer: make e2e-debug
#
# Usage:
#   # Build and start container in detached mode
#   FEDORA_VERSION=43 docker-compose -f docker/docker-compose.e2e.yml up -d
#
#   # Start GNOME Shell session and run tests using docker exec
#   docker exec forge-e2e /usr/local/bin/start-user-session.sh 99
#   docker exec --user gnomeshell -e DISPLAY=:99 forge-e2e set-env.sh /app/scripts/run-tests.sh
#
#   # Stop container
#   docker-compose -f docker/docker-compose.e2e.yml down

services:
  e2e:
    build:
      context: ..
      dockerfile: docker/Dockerfile.e2e
      args:
        FEDORA_VERSION: ${FEDORA_VERSION:-43}
    image: forge-e2e-fedora${FEDORA_VERSION:-43}
    container_name: forge-e2e
    volumes:
      - ../tests/e2e:/app/tests/e2e:ro
      - ../e2e-results:/app/e2e-results
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      - DISPLAY=:99
      - container=docker
      - FEDORA_VERSION=${FEDORA_VERSION:-43}
    # Systemd requires privileged mode and proper cgroup namespace
    privileged: true
    cap_add:
      - SYS_NICE
      - IPC_LOCK
      - SYS_ADMIN
    # Use host cgroup namespace for systemd support
    cgroup: host
    # Don't override the command - container uses systemd by default
    # Use docker exec to run commands after container starts
