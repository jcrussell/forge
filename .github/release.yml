# Categorizes GitHub's auto-generated release notes (generate_release_notes in
# .github/workflows/publish.yml) by PR label.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Other Changes
      labels:
        - "*"
