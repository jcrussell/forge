# Release workflow: build the GNOME Shell extension, attest its provenance, and
# publish it as a GitHub Release.
#
# Trigger: push a tag matching v* (the repo's v<gnome>-<ego-build> scheme, e.g.
# v49-90). The tagged commit is built into forge@jmmaranan.com.zip — the same
# EGO-shaped zip a maintainer uploads to extensions.gnome.org (see RELEASING.md).
#
# The zip is checksummed (SHA256SUMS) and gets a keyless build-provenance
# attestation (Sigstore via GitHub OIDC — no signing keys to manage), verifiable
# by users with `gh attestation verify`. NOTE: this secures the GitHub side-load
# path only; extensions.gnome.org has no author-signing mechanism.
#
# workflow_dispatch runs the same build + attest as a dry run but does NOT create
# a Release (the release step is gated on a tag ref).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Override git ref to build"
        type: string
        default: ""
        required: false

permissions:
  contents: write # create the Release and upload assets
  id-token: write # OIDC token for keyless attestation
  attestations: write # write the provenance attestation

jobs:
  publishing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          # Full history: `make build` runs `git shortlog -sne --all` to generate
          # the contributors list (lib/prefs/metadata.js).
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Install linux tools
        run: |
          sudo apt-get update
          # libglib2.0-bin provides glib-compile-schemas (needed by `make build`).
          sudo apt-get install -y --no-install-recommends gettext make zip libglib2.0-bin

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js project dependencies
        run: npm ci

      - name: Run unit tests (release gate)
        run: npm test

      - name: Build distributable zip
        # Stamp the tag into metadata.json's version-name for release builds only
        # (build-target guard; a plain `make dist` leaves committed metadata clean).
        env:
          FORGE_VERSION_NAME: ${{ github.ref_name }}
        run: make dist

      - name: Generate checksum
        run: sha256sum "forge@jmmaranan.com.zip" > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "forge@jmmaranan.com.zip"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: forge-gnome-extension
          path: |
            forge@jmmaranan.com.zip
            SHA256SUMS

      - name: Publish GitHub Release
        # Only when built from a tag (tag push, or a tag selected for dispatch).
        # A branch dispatch is a dry run: build + attest, no Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # A -beta/-rc tag (v49-90-beta.1, v49-90-rc.1) is a pre-release:
          # flagged as such and never shown as "Latest". A bare tag (v49-90 — the
          # hyphen is the gnome-major/ego-build separator, not a suffix) is the
          # stable, EGO-bound cut. See RELEASING.md.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            forge@jmmaranan.com.zip
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
