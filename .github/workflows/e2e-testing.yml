# E2E Testing Workflow for Forge
# Runs end-to-end tests against real GNOME Shell in self-contained containers
#
# Uses Fedora version numbers:
#   Fedora 39 = GNOME 45, Fedora 40 = GNOME 46, Fedora 41 = GNOME 47,
#   Fedora 42 = GNOME 48, Fedora 43 = GNOME 49, Fedora 44 = GNOME 50

name: e2e-testing

on:
  push:
    branches: ["main"]
    paths-ignore:
      - .git*
      - .husky/**
      - "*.md"
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - .git*
      - .husky/**
      - "*.md"
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version (39=GNOME45, 40=GNOME46, 41=GNOME47, 42=GNOME48, 43=GNOME49, 44=GNOME50)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Read versions config
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.fedora_version }}" ]; then
            echo "matrix={\"fedora_version\":[${{ github.event.inputs.fedora_version }}]}" >> $GITHUB_OUTPUT
          else
            VERSIONS=$(cat tests/e2e/gnome-versions.json | jq -c '.supported_fedora')
            echo "matrix={\"fedora_version\":$VERSIONS}" >> $GITHUB_OUTPUT
          fi

  e2e-tests:
    needs: setup
    if: github.event.pull_request.draft == false

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build extension
        run: |
          npm ci
          make build

      - name: Build E2E container
        run: |
          docker build -f docker/Dockerfile.e2e \
            -t forge-e2e-fedora${{ matrix.fedora_version }} \
            --build-arg FEDORA_VERSION=${{ matrix.fedora_version }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            .

      - name: Run E2E tests
        id: e2e_tests
        run: |
          mkdir -p e2e-results

          # Start container with systemd as PID 1
          POD=$(docker run --rm -td \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e container=docker \
            -v $(pwd)/e2e-results:/app/e2e-results \
            forge-e2e-fedora${{ matrix.fedora_version }})

          # Ensure cleanup on exit
          trap "docker stop $POD 2>/dev/null || true" EXIT

          echo "Container: $POD"
          echo "Waiting for container to initialize..."
          sleep 3

          echo "Starting GNOME Shell session..."
          docker exec $POD /usr/local/bin/start-user-session.sh 99

          # Fix ownership of bind-mounted results directory
          docker exec $POD chown -R gnomeshell:gnomeshell /app/e2e-results

          echo "Running E2E tests..."
          docker exec --user gnomeshell -e DISPLAY=:99 $POD \
            set-env.sh /app/scripts/run-tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-fedora${{ matrix.fedora_version }}
          path: e2e-results/
          retention-days: 14

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-screenshots-fedora${{ matrix.fedora_version }}
          path: e2e-results/screenshots/
          retention-days: 7

  # Gating keybinding-dispatch lane (forge-5qh). The full suite runs in dbus
  # dispatch mode (contamination-free); keybinding mode drives Forge via synthetic
  # Clutter super-modifier keypresses, which leak across test boundaries and break
  # ~13 of the 90 tests when run as a suite (see memory
  # mutter-virtualinputdevice-super-modifier-tilesnap). A single isolated test has
  # no *cross-test* contamination by construction, so this lane runs exactly ONE
  # keybinding test (Super+h / Super+l focus) under DISPATCH_MODE=keybinding and
  # GATES on it (no continue-on-error). It verifies the keybinding dispatch path
  # actually fires end-to-end without poisoning compositor tile state. Pinned to
  # Fedora 43 (GNOME 49, stable headless Wayland); verified reliable (3/3 local).
  e2e-keybinding-gate:
    needs: setup
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      KB_FEDORA_VERSION: 43
      KB_TEST: test_focus_left_right
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build extension
        run: |
          npm ci
          make build

      - name: Build E2E container
        run: |
          docker build -f docker/Dockerfile.e2e \
            -t forge-e2e-fedora${KB_FEDORA_VERSION} \
            --build-arg FEDORA_VERSION=${KB_FEDORA_VERSION} \
            --build-arg GIT_SHA=${{ github.sha }} \
            .

      - name: Run single keybinding test (gating)
        run: |
          mkdir -p e2e-results
          POD=$(docker run --rm -td \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e container=docker \
            -v $(pwd)/e2e-results:/app/e2e-results \
            forge-e2e-fedora${KB_FEDORA_VERSION})
          trap "docker stop $POD 2>/dev/null || true" EXIT
          sleep 3
          docker exec $POD /usr/local/bin/start-user-session.sh 99
          docker exec $POD chown -R gnomeshell:gnomeshell /app/e2e-results
          # DISPATCH_MODE=keybinding routes input_sim via synthetic keypresses;
          # -k isolates ONE test (run-tests.sh runs `pytest tests/ $ARGS`, so a
          # node id would be appended and run the whole suite — use -k).
          docker exec --user gnomeshell -e DISPLAY=:99 -e DISPATCH_MODE=keybinding $POD \
            set-env.sh /app/scripts/run-tests.sh -k ${KB_TEST}

      - name: Upload keybinding-gate results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-keybinding-gate-results
          path: e2e-results/
          retention-days: 14

  # Multi-monitor lane (forge-wrt). test_window_retiles_across_monitors self-skips
  # unless global.display.get_n_monitors() >= 2, which needs a 2nd --virtual-monitor
  # at session boot (FORGE_E2E_VIRTUAL_MONITORS=2, read in start-user-session.sh).
  # The default matrix never sets it, so multi-monitor tiling had zero CI signal.
  # Headless dual-monitor is Wayland-only (gnome-shell --headless --wayland accepts
  # two --virtual-monitor flags); X11/Xvfb lanes (F<=42) cannot fake a 2nd output, so
  # this lane runs only on the Wayland-headless versions: F43 (GNOME 49) and F44
  # (GNOME 50), via a {fedora:[43,44]} matrix. Modeled on e2e-keybinding-gate.
  # Decision: a dedicated job (not a {monitors:[1,2]} dimension on the default lane)
  # keeps the default 6-version lane fast and unchanged.
  #
  # NOTE: this IS wired into e2e-summary's blocking failure ladder (forge-1zn part 1) —
  # a failure on either the F43 or F44 leg blocks the merge, same as the keybinding gate.
  e2e-multimonitor-gate:
    needs: setup
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    env:
      MM_FEDORA_VERSION: ${{ matrix.fedora }}
      MM_TEST: test_window_retiles_across_monitors
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build extension
        run: |
          npm ci
          make build

      - name: Build E2E container
        run: |
          docker build -f docker/Dockerfile.e2e \
            -t forge-e2e-fedora${MM_FEDORA_VERSION} \
            --build-arg FEDORA_VERSION=${MM_FEDORA_VERSION} \
            --build-arg GIT_SHA=${{ github.sha }} \
            .

      - name: Run multi-monitor test (gating)
        run: |
          mkdir -p e2e-results
          POD=$(docker run --rm -td \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e container=docker \
            -v $(pwd)/e2e-results:/app/e2e-results \
            forge-e2e-fedora${MM_FEDORA_VERSION})
          trap "docker stop $POD 2>/dev/null || true" EXIT
          sleep 3
          # FORGE_E2E_VIRTUAL_MONITORS=2 MUST go on the session-boot exec — it is read
          # at boot in start-user-session.sh to add a 2nd --virtual-monitor. (Unlike
          # DISPATCH_MODE in the keybinding lane, which goes on the run-tests exec.)
          docker exec -e FORGE_E2E_VIRTUAL_MONITORS=2 $POD /usr/local/bin/start-user-session.sh 99
          docker exec $POD chown -R gnomeshell:gnomeshell /app/e2e-results
          # -k isolates the single multimonitor test; -rs reports skip reasons.
          docker exec --user gnomeshell -e DISPLAY=:99 $POD \
            set-env.sh /app/scripts/run-tests.sh -k ${MM_TEST} -rs

      - name: Assert the multi-monitor test actually ran (not skipped)
        run: |
          # A skipped test exits 0, so the run step alone would pass GREEN while
          # exercising nothing — e.g. if the session came up single-screen and the test
          # self-skipped on get_monitor_count() < 2. Parse junit.xml and fail unless
          # exactly one test passed with zero skips. This makes the gate non-vacuous.
          python3 - "$PWD/e2e-results/junit.xml" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              sys.exit(f"::error::Could not read junit.xml ({e}); the test run produced no results.")
          # junit.xml root is <testsuites> or <testsuite>; aggregate either way.
          suites = root.findall("testsuite") or [root]
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped} failures={failures} errors={errors}")
          if tests == 0:
              sys.exit("::error::Multi-monitor test was not collected — check the -k filter.")
          if skipped:
              sys.exit("::error::Multi-monitor test SKIPPED (needs 2 monitors). Did the session "
                       "boot Wayland-headless with FORGE_E2E_VIRTUAL_MONITORS=2? A skip here means the "
                       "lane exercised nothing.")
          if failures or errors:
              sys.exit("::error::Multi-monitor test failed.")
          print("Multi-monitor test ran and passed.")
          EOF

      - name: Upload multimonitor-gate results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-multimonitor-gate-results-fedora${{ matrix.fedora }}
          path: e2e-results/
          retention-days: 14

  e2e-summary:
    needs: [setup, e2e-tests, e2e-keybinding-gate, e2e-multimonitor-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check E2E test results
        run: |
          # e2e-multimonitor-gate (forge-wrt/forge-1zn) is now BLOCKING: a failure on
          # either the F43 or F44 leg (the matrix result is `failure` if either fails)
          # gates the merge, same as the keybinding gate. Promoted after it ran green
          # on both legs (forge-1zn part 1).
          if [ "${{ needs.e2e-tests.result }}" == "failure" ]; then
            echo "::error::Some E2E tests failed"
            exit 1
          elif [ "${{ needs.e2e-keybinding-gate.result }}" == "failure" ]; then
            echo "::error::Keybinding-dispatch gate failed"
            exit 1
          elif [ "${{ needs.e2e-multimonitor-gate.result }}" == "failure" ]; then
            echo "::error::Multi-monitor gate failed"
            exit 1
          elif [ "${{ needs.e2e-tests.result }}" == "cancelled" ]; then
            echo "::warning::E2E tests were cancelled"
            exit 0
          else
            echo "All E2E tests passed!"
          fi
