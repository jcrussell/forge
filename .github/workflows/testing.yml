# This workflow will install Node/NPM dependencies, run tests and lint source code

# For more information see:
#@ https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: testing
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - .git*
      - .husky/**
      - "*.md"
  pull_request:
    branches: ["main", "dev"]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - .git*
      - .husky/**
      - "*.md"
  # workflow_dispatch:
  #   inputs:
  #     ref:
  #       description: 'Override git ref'
  #       type: string
  #       default: ''
  #       required: false

jobs:
  linting:
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        node_version: ["20", "22"]

    runs-on: "${{ matrix.os }}"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install linux tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext make zip

      - name: Set up Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: 'npm'

      - name: Install Node.js project dependencies
        run: npm ci --verbose

      - name: Build Node.js project
        run: npm run build --if-present --verbose

      - name: Run linter (prettier)
        run: npm run lint --verbose

      # Blocking: lint the extension's ES-module sources under eslint's recommended set
      # (forge-fhen.3). Catches missing imports, dead code, and the recommended correctness
      # class before merge.
      - name: Lint extension sources
        run: npm run lint:src

      # Advisory static-analysis gate (non-blocking, like the Security audit step below).
      # Surfaces type errors without failing the build yet; enforcement tracked as forge-fhen.2.
      - name: Type check (advisory)
        run: npm run typecheck || true

      - name: Run unit tests
        run: npm test --verbose

      - name: Generate coverage report
        run: npm run test:coverage --verbose

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Security audit
        run: npm audit --omit=dev || true

      - name: Test Packaging
        run: make dist

  python-lint:
    # Format + lint the e2e Python suite with ruff (see ruff.toml). Kept separate
    # from the Node matrix above so it runs once, not per node_version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting (ruff format)
        run: ruff format --check tests/e2e

      - name: Lint (ruff check)
        run: ruff check tests/e2e
