[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    focus: marks tests that test focus navigation
    layout: marks tests that test layout operations
    float: marks tests that test floating windows
    resize: marks tests that test window resizing
    drag: marks tests that test drag and drop
    dialog: marks tests that test dialog windows
    workspace: marks tests that test workspace operations
    settings: marks tests that test settings changes
    snap: marks tests that test snap layouts
    rebalance: marks tests that test window close rebalancing
